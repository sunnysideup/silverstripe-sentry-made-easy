---
Name: sentry-made-easy-using-SS_SENTRY_DSN
Only:
  envvarset:
    - 'SS_SENTRY_DSN'
Except:
  environment: 'dev'
After:
  - logging
  - cli-config
---
SilverStripe\Core\Injector\Injector:
  Sunnysideup\SentryMadeEasy\SentryHandler:
    constructor:
      level: error
      bubble: true
  Psr\Log\LoggerInterface:
    calls:
      pushSentryHandler: [ pushHandler, [ '%$Sunnysideup\SentryMadeEasy\SentryHandler' ] ]
  Sunnysideup\SentryMadeEasy\Logging\ConsoleErrorListener:
    constructor:
      logger: '%$Psr\Log\LoggerInterface'
  Symfony\Contracts\EventDispatcher\EventDispatcherInterface.sake:
    calls:
      logSentryConsoleErrors: [ addListener, [ 'console.error', [ '%$Sunnysideup\SentryMadeEasy\Logging\ConsoleErrorListener', '__invoke' ] ] ]
